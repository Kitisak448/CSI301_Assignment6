<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank DApp System Dashboard</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>

<body>

    <div class="container">
        <!-- แถบข้อมูลนักศึกษา & หัวข้อแบบกระชับ -->
        <div class="top-bar">
            <div class="student-info">
                <span>🎓 <strong>รหัสนักศึกษา:</strong> 66099934</span>
                <span class="divider">|</span>
                <span><strong>ชื่อ-สกุล:</strong> นายกิติศักดิ์ สุรพัฒน์ไพดิษฐ์</span>
            </div>
            <h2 class="title">🏦 Bank DApp System</h2>
        </div>

        <!-- กล่องแจ้งเตือน UI -->
        <div id="notification" class="notification"></div>

        <!-- Layout แบบ Grid 2 คอลัมน์ -->
        <div class="grid-layout">
            <!-- แถวที่ 1 ซ้าย: MetaMask -->
            <div class="card">
                <h3>🦊 กระเป๋าเงิน MetaMask</h3>
                <button id="connectWalletBtn" class="btn btn-primary">เชื่อมต่อ MetaMask</button>
                <div id="walletAddress" class="status warning">สถานะ: ยังไม่ได้เชื่อมต่อ</div>
            </div>

            <!-- แถวที่ 1 ขวา: ตรวจสอบยอดเงิน -->
            <div class="card">
                <h3>💰 ตรวจสอบยอดเงิน</h3>
                <div class="balance-box">
                    <span class="balance-label">ยอดเงินในบัญชี</span>
                    <span id="balanceDisplay" class="balance-amount">- ETH</span>
                </div>
                <button id="checkBalanceBtn" class="btn btn-secondary">Check Balance</button>
            </div>

            <!-- แถวที่ 2 ซ้าย: ฝากเงิน -->
            <div class="card">
                <h3>📥 ฝากเงิน (Deposit)</h3>
                <div class="form-group">
                    <label for="depositAmount">จำนวน ETH:</label>
                    <input type="number" id="depositAmount" step="0.01" placeholder="เช่น 0.01">
                </div>
                <button id="depositBtn" class="btn btn-success">Deposit</button>
            </div>

            <!-- แถวที่ 2 ขวา: ถอนเงิน -->
            <div class="card">
                <h3>📤 ถอนเงิน (Withdraw)</h3>
                <div class="form-group">
                    <label for="withdrawAmount">จำนวน ETH:</label>
                    <input type="number" id="withdrawAmount" step="0.01" placeholder="เช่น 0.01">
                </div>
                <button id="withdrawBtn" class="btn btn-danger">Withdraw</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
